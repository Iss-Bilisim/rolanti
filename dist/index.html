<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rölanti · Satış</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#B4561A}a:hover{color:#8F4012}
.rl{
  --bg:#FAF6F0;--surface:#FFFFFF;--sunk:#F3ECE2;--sunk-2:#EDE4D8;--line:#ECE3D8;--line-2:#E0D5C7;
  --ink:#2B231E;--ink-2:#6F645B;--ink-3:#8C8076;
  --accent:#E0752D;--accent-ink:#A9511A;--accent-tint:#FBEADB;--accent-tint-2:#F7DCC4;--on-accent:#2B231E;--ring:#D2651F;
  --ok:#4A9A6B;--ok-ink:#2E7A4E;--ok-tint:#E6F2EA;
  --warn:#D9A23A;--warn-ink:#8C5F0C;--warn-tint:#FBF0D9;
  --err:#CF5A43;--err-ink:#A8402C;--err-tint:#FBE7E2;
  --shadow-float:0 1px 2px rgba(74,48,24,.06),0 12px 32px -12px rgba(74,48,24,.22);
  --shadow-press:0 1px 0 rgba(74,48,24,.06);--swatch-ring:rgba(43,35,30,.18);--illo:#E6DACA;--illo-line:#6F645B;
  --spring:cubic-bezier(.22,1.2,.36,1);--out:cubic-bezier(.16,1,.3,1);
  font-family:"Onest",ui-sans-serif,sans-serif;color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
.rl[data-theme="dark"]{
  --bg:#1D1A17;--surface:#27231F;--sunk:#221F1B;--sunk-2:#312C27;--line:#353029;--line-2:#433C34;
  --ink:#F3ECE3;--ink-2:#B9AC9F;--ink-3:#958879;
  --accent:#E0752D;--accent-ink:#F29A5C;--accent-tint:#3A2819;--accent-tint-2:#4A321E;--on-accent:#1D1A17;--ring:#F08A45;
  --ok:#5DB07F;--ok-ink:#7CC79A;--ok-tint:#1F2E24;
  --warn:#E2B04E;--warn-ink:#E8BC62;--warn-tint:#33291A;
  --err:#DD6A53;--err-ink:#F08A73;--err-tint:#3A221C;
  --shadow-float:0 1px 2px rgba(0,0,0,.3),0 16px 40px -12px rgba(0,0,0,.55);
  color-scheme:dark;--swatch-ring:rgba(243,236,227,.38);--illo:#3E372F;--illo-line:#C9BCAE;
}
.rl *{box-sizing:border-box}
.rl ::selection{background:var(--accent-tint-2);color:var(--ink)}
.rl :where(button,input,textarea,select){font:inherit;color:inherit}
.rl button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.rl :focus{outline:none}
.rl :focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:8px}
.rl input{caret-color:var(--accent)}
.search input:focus-visible,.cin input:focus-visible,.cmd input:focus-visible{outline:none}
.rl input::placeholder{color:var(--ink-2);opacity:1}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"zero" 0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.ic.lg{width:22px;height:22px}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.scroll::-webkit-scrollbar{width:10px;height:10px}
.scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:3px solid transparent;background-clip:padding-box}

/* nav */
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;background:transparent;border-radius:10px;color:var(--ink-2);font-size:14.5px;font-weight:500;text-align:left;width:100%;transition:background .18s var(--out),color .18s var(--out)}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav.on{background:var(--accent-tint);color:var(--ink);font-weight:600}
.nav.on .ic{color:var(--accent-ink)}
.nav:active{transform:scale(.98)}

/* search */
.search{display:flex;align-items:center;gap:12px;height:60px;padding:0 8px 0 18px;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line-2);transition:box-shadow .18s var(--out)}
.search:focus-within,.search.is-focus{box-shadow:0 0 0 2px var(--ring),0 6px 20px -10px rgba(210,101,31,.35)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:18px;font-weight:500;height:100%;letter-spacing:-.005em}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);transition:background .16s var(--out),color .16s var(--out),transform .16s var(--spring)}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn:active{transform:scale(.92)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;transition:background .16s var(--out),box-shadow .16s var(--out),transform .16s var(--spring)}
.chip:hover{box-shadow:inset 0 0 0 1px var(--ink-3)}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--accent-tint);box-shadow:inset 0 0 0 1.5px var(--accent)}
.chip.ghost{background:transparent;box-shadow:inset 0 0 0 1px transparent;color:var(--ink-2)}
.chip.ghost:hover{background:var(--sunk);color:var(--ink)}
.chip .x{display:inline-flex;margin-right:-6px;width:26px;height:26px;align-items:center;justify-content:center;border-radius:99px}
.chip .x:hover{background:var(--accent-tint-2)}

/* quick */
.quick{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:0 12px 0 14px;border:0;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-align:left;font-size:14px;font-weight:500;line-height:1.2;transition:background .16s var(--out),box-shadow .16s var(--out),transform .2s var(--spring)}
.quick:hover{box-shadow:inset 0 0 0 1px var(--line-2);background:var(--sunk)}
.quick:active{transform:scale(.97)}
.quick .p{font-size:13px;color:var(--ink-2)}
.quick.flash{animation:flash .5s var(--out)}

/* product rows */
.prow{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto 120px 132px;align-items:center;column-gap:20px;min-height:68px;padding:10px 18px;border-radius:12px;transition:background .14s var(--out)}
.prow + .prow{box-shadow:0 -1px 0 var(--line)}
.prow:hover{background:var(--sunk)}
.prow.act{background:var(--accent-tint);box-shadow:none}
.prow.act + .prow{box-shadow:none}
.prow.act .enter{opacity:1;transform:none}
.prow.out .pname{color:var(--ink-2)}
.prow.flash{animation:flash .5s var(--out)}
.prow.shake{animation:shake .32s var(--out)}
.hit{position:absolute;inset:0;border:0;background:transparent;border-radius:12px;z-index:0}
.prow > *:not(.hit){position:relative;z-index:1;pointer-events:none}
.prow .live{pointer-events:auto}
.pname{font-size:15.5px;font-weight:600;letter-spacing:-.008em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.oem{font-size:12px;color:var(--ink-2);letter-spacing:.01em}
.compat{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--sunk-2);font-size:12px;color:var(--ink-2);font-weight:500}
.compat.more{background:transparent;padding:0 2px}
.price{font-size:19px;font-weight:600;text-align:right;letter-spacing:-.01em}
.enter{display:inline-flex;align-items:center;justify-content:center;width:26px;height:24px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:600;opacity:0;transform:translateY(3px);transition:opacity .16s var(--out),transform .2s var(--spring)}

/* product cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px;grid-auto-flow:dense;padding:2px 2px 16px}
.pcard{position:relative;display:flex;flex-direction:column;min-height:0;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .12s ease-out,transform .12s ease-out}
.pcard:hover{box-shadow:inset 0 0 0 1px var(--ink-3)}
.pcard:active{transform:scale(.985)}
.pcard.act{box-shadow:0 0 0 2px var(--accent),0 10px 24px -14px rgba(210,101,31,.45)}
.pcard.act .enter{opacity:1;transform:none}
.pcard.flash{}
.pcard.shake{animation:shake .32s var(--out)}
.pcard > *:not(.hit){position:relative;z-index:1;pointer-events:none}
.pcard .live{pointer-events:auto}
.pimg{position:relative;height:150px;margin:6px 6px 0;border-radius:12px;background:var(--sunk);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcard.out .pimg img{filter:grayscale(1);opacity:.55}
.pimg svg{width:70px;height:70px;overflow:visible}
.pcard.out .pimg svg{opacity:.42;filter:grayscale(.6)}
.il-f{fill:var(--illo);stroke:var(--illo-line);stroke-width:1.6;stroke-linejoin:round;fill-rule:evenodd}
.il-l{fill:none;stroke:var(--illo-line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.il-a{fill:var(--accent);stroke:var(--illo-line);stroke-width:1.6;stroke-linejoin:round}
.pimg .enter{position:absolute;z-index:2;top:8px;right:8px;width:auto;padding:0 8px;gap:6px;font-size:12px}
.sbadge{position:absolute;z-index:2;top:8px;left:8px;display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--err-tint);color:var(--err-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sbadge.warn{background:var(--warn-tint);color:var(--warn-ink)}
.pbody{display:flex;flex-direction:column;flex:1;padding:9px 14px 11px}
.pcard .pname{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:14.5px;font-weight:600;line-height:1.3;min-height:38px}
.pcard .oem{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcomp{font-size:12.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfoot{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.pcard .price{font-size:21px;text-align:left}
.pcard .gauge{align-items:flex-end}
.pcard .dots{margin:4px 0 -6px -10px}
.pcard .notice{grid-column:1/-1}
.thumb{overflow:hidden;width:48px;height:48px;border-radius:10px;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;flex:none}
.thumb svg{width:34px;height:34px;overflow:visible}
@keyframes flashc{0%{background:var(--accent-tint)}100%{background:var(--surface)}}
.cbadge{position:absolute;z-index:2;right:8px;top:8px;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px 0 8px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:700;box-shadow:0 2px 6px rgba(74,48,24,.25)}
.cbadge svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lthumb{grid-row:1 / 3;width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--sunk)}
.lthumb img{width:100%;height:100%;object-fit:cover;display:block}
.line.hl{animation:hl2 .8s ease-out}
@keyframes hl2{0%{background:var(--accent-tint-2)}100%{background:transparent}}
@keyframes hl{0%{background:var(--accent-tint-2)}100%{background:transparent}}
.fly{position:fixed;z-index:100;pointer-events:none;border-radius:12px;object-fit:cover;box-shadow:0 12px 30px -8px rgba(74,48,24,.45)}
.pcode{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;font-family:"Onest",sans-serif}
.tag.ori{background:var(--ok-tint);color:var(--ok-ink)}
.tag.mua{background:var(--sunk-2);color:var(--ink-2)}
/* variant dots */
.dots{display:flex;gap:2px}
.dot{width:40px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:8px;padding:0}
.dot i{display:block;width:18px;height:18px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--swatch-ring);transition:transform .2s var(--spring),box-shadow .16s var(--out)}
.dot:hover i{transform:scale(1.12)}
.dot.sel i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.prow.act .dot.sel i{box-shadow:0 0 0 2px var(--accent-tint),0 0 0 4px var(--ink)}
.dot.none i{opacity:.35;background-image:linear-gradient(135deg,transparent 45%,var(--err) 45%,var(--err) 55%,transparent 55%) !important}

/* fuel gauge stock */
.gauge{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.segs{display:flex;gap:3px}
.seg{width:14px;height:6px;border-radius:2px;background:var(--line-2)}
.seg.ok{background:var(--ok)}.seg.warn{background:var(--warn)}
.segs.none .seg{background:transparent;box-shadow:inset 0 0 0 1px var(--err)}
.stxt{font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.stxt.warn{color:var(--warn-ink)}.stxt.err{color:var(--err-ink)}

/* notice under row */
.notice{display:flex;align-items:flex-start;gap:12px;margin:4px 6px 8px;padding:14px 16px;border-radius:12px;background:var(--err-tint);color:var(--ink);font-size:14px;line-height:1.45;animation:drop .24s var(--out)}
.notice .ic{color:var(--err-ink);margin-top:1px}
.notice.info{background:var(--warn-tint)}
.notice.info .ic{color:var(--warn-ink)}
.tbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:10px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);font-size:14px;font-weight:600;transition:transform .16s var(--spring),background .16s var(--out)}
.tbtn:hover{background:var(--sunk)}
.tbtn:active{transform:scale(.97)}
.tbtn.pri{background:var(--accent);color:var(--on-accent);box-shadow:none}
.tbtn.pri:hover{background:#E8833E}
.tbtn.plain{background:transparent;box-shadow:none;color:var(--ink-2)}
.tbtn.plain:hover{color:var(--ink);background:var(--sunk)}

/* cart */
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;row-gap:6px;padding:12px 8px 10px 14px;border-radius:12px;transition:background .14s var(--out)}
.line + .line{box-shadow:0 -1px 0 var(--line)}
.line:hover{background:var(--sunk)}
.line:hover + .line{box-shadow:none}
.line.sel{background:var(--sunk)}
.line.sel + .line{box-shadow:none}
.line.new{animation:hl .8s ease-out}
.line.wp{grid-template-columns:52px minmax(0,1fr) auto}
.lname{font-size:14.5px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lsub{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);min-width:0;white-space:nowrap;overflow:hidden}
.lsub i{display:inline-block;width:10px;height:10px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--swatch-ring)}
.qty{display:inline-flex;align-items:center;height:44px;border-radius:12px;background:var(--sunk-2);padding:0}
.qty button{width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);transition:background .14s var(--out),transform .14s var(--spring)}
.qty button:hover{background:var(--surface);color:var(--ink)}
.qty button:active{transform:scale(.88)}
.qty span{min-width:26px;text-align:center;font-size:15px;font-weight:600}
.qty span.bump{animation:bump .3s var(--spring)}
.ltot{font-size:15px;font-weight:600;text-align:right;padding-right:6px}
.lctl{display:flex;align-items:center;gap:2px;justify-self:end}
.del{width:44px;height:44px;border:0;border-radius:10px;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);opacity:0;transition:opacity .14s var(--out),background .14s var(--out),color .14s var(--out)}
.line:hover .del,.line.sel .del,.del:focus-visible{opacity:1}
.del:hover{background:var(--err-tint);color:var(--err-ink)}
@media (hover:none){.del{opacity:1}}

.trow{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink-2);min-height:28px}
.trow .mono{color:var(--ink);font-size:14px}
.disc{border:0;background:transparent;padding:0 4px;margin-left:-4px;height:32px;border-radius:6px;color:var(--accent-ink);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.disc:hover{background:var(--accent-tint)}
.total{font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1}

/* pay */
.pay{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;height:58px;padding:0 12px 0 16px;border:0;border-radius:12px;background:var(--sunk-2);font-size:16px;font-weight:600;transition:background .16s var(--out),transform .18s var(--spring),box-shadow .16s var(--out)}
.pay:hover{background:var(--line-2)}
.pay:active{transform:scale(.97)}
.pay.pri{background:var(--accent);color:var(--on-accent)}
.pay.pri:hover{background:#E8833E}
.pay:disabled{opacity:.45;cursor:default;transform:none}
.pay:disabled:hover{background:var(--sunk-2)}
.pay.pri:disabled:hover{background:var(--accent)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;padding:0 6px;border-radius:6px;font-family:"Geist Mono",ui-monospace,monospace;font-size:11.5px;font-weight:500;background:var(--surface);color:var(--ink-2);box-shadow:inset 0 -1px 0 var(--line-2),inset 0 0 0 1px var(--line)}
.pay.pri .kbd{background:rgba(43,35,30,.12);color:var(--on-accent);box-shadow:none}
.sub2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;border:0;border-radius:12px;background:transparent;font-size:14.5px;font-weight:600;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2);transition:background .16s var(--out),color .16s var(--out),transform .16s var(--spring)}
.sub2:hover{background:var(--sunk);color:var(--ink)}
.sub2:active{transform:scale(.97)}
.sub2:disabled{opacity:.45;cursor:default}

/* top */
.pill{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:0;border-radius:10px;background:transparent;font-size:14px;color:var(--ink-2);transition:background .16s var(--out)}
.pill:hover{background:var(--sunk);color:var(--ink)}
.pill b{color:var(--ink);font-weight:600}
.theme{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunk-2)}
.theme button{width:42px;height:38px;border:0;border-radius:9px;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);transition:background .2s var(--out),color .2s var(--out)}
.theme button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-press)}
.badge{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:99px;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}

/* popovers / overlays */
.pop{position:absolute;z-index:30;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-float),0 0 0 1px var(--line);animation:pop .2s var(--spring);transform-origin:top right}
.veil{position:absolute;inset:0;z-index:40;background:rgba(29,26,23,.28);display:flex;justify-content:center;align-items:flex-start;padding-top:120px;animation:fade .16s var(--out)}
.cmd{width:560px;max-width:calc(100% - 32px);background:var(--surface);border-radius:16px;box-shadow:var(--shadow-float);overflow:hidden;animation:pop .22s var(--spring);transform-origin:top center}
.cmdi{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 16px;border:0;background:transparent;text-align:left;font-size:15px;border-radius:10px}
.cmdi:hover,.cmdi.act{background:var(--accent-tint)}
.ddi{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 12px;border:0;background:transparent;text-align:left;border-radius:10px}
.ddi:hover{background:var(--sunk)}

/* customer */
.av{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--accent-tint);color:var(--accent-ink);font-weight:700;font-size:14px;flex:none}
.plate{display:inline-flex;align-items:center;height:22px;padding:0 6px;border-radius:5px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);font-size:12px;font-weight:600;color:var(--ink);letter-spacing:.02em}
.cin{display:flex;align-items:center;gap:10px;height:48px;padding:0 6px 0 14px;border-radius:12px;background:var(--sunk);box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .16s var(--out),background .16s var(--out)}
.cin:focus-within{background:var(--surface);box-shadow:0 0 0 2px var(--ring)}
.cin input{flex:1;min-width:0;border:0;background:transparent;font-size:15px;height:100%}

/* success */
.done{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;flex:1;padding:24px;animation:fade .2s var(--out)}
.tick{width:84px;height:84px;border-radius:99px;background:var(--ok-tint);display:flex;align-items:center;justify-content:center;margin-bottom:14px;animation:popin .42s var(--spring)}
.tick svg{width:44px;height:44px;fill:none;stroke:var(--ok-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tick path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .36s .12s var(--out) forwards}
.reset{width:160px;height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:22px}
.reset i{display:block;height:100%;background:var(--ok);transform-origin:left;animation:grow 1s linear forwards}
.reset.hold i{animation:none;transform:scaleX(.62)}

.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:35;display:flex;align-items:center;gap:12px;padding:12px 16px 12px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;box-shadow:var(--shadow-float);animation:up .24s var(--spring)}

.pg{flex:1;min-height:0;display:flex;flex-direction:column;padding:4px 24px 20px;animation:fade .2s var(--out)}
.pghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pghead h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em;margin-right:auto}
.tbl{flex:1;min-height:0;background:var(--surface);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);padding:6px}
.th,.tr{display:grid;align-items:center;column-gap:20px;padding:0 18px}
.tr{min-height:68px}
.th{height:40px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tr{min-height:62px;border-radius:12px;font-size:14.5px;transition:background .14s var(--out)}
.tr + .tr{box-shadow:0 -1px 0 var(--line)}
.tr:hover{background:var(--sunk)}
.tr:hover + .tr{box-shadow:none}
.r{text-align:right}
.st{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:99px;background:currentColor}
.st.wait{background:var(--sunk-2);color:var(--ink-2)}
.st.work{background:var(--accent-tint);color:var(--accent-ink)}
.st.ready{background:var(--ok-tint);color:var(--ok-ink)}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kcell{background:var(--surface);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);padding:16px 18px}
.kcell .l{font-size:13.5px;color:var(--ink-2);font-weight:500}
.kcell .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.kcell .bar{height:6px;border-radius:3px;background:var(--sunk-2);margin-top:12px;overflow:hidden}
.kcell .bar i{display:block;height:100%;background:var(--ink-3);border-radius:3px}
.kcell .bar i.a{background:var(--accent)}
.kcell .p{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.sub{font-size:14px;color:var(--ink-2)}
.row2{display:grid;align-items:center;column-gap:16px;width:100%;min-height:64px;padding:8px 18px;border:0;border-radius:12px;background:transparent;text-align:left;font-size:14.5px;color:var(--ink);transition:background .12s ease-out}
.row2 + .row2{box-shadow:0 -1px 0 var(--line)}
.row2:hover{background:var(--sunk)}
.row2.on{background:var(--accent-tint);box-shadow:none}
.row2.on + .row2,.row2:hover + .row2{box-shadow:none}
.drawer{flex:none;width:430px;max-width:44%;background:var(--surface);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;overflow:auto;animation:fade .18s ease-out}
.dhead{display:flex;align-items:flex-start;gap:8px;padding:18px 10px 14px 22px;box-shadow:0 1px 0 var(--line)}
.dbody{display:flex;flex-direction:column;gap:16px;padding:18px 22px 24px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.inp{height:48px;padding:0 14px;border:0;border-radius:12px;background:var(--sunk);font-size:15px;color:var(--ink);transition:box-shadow .12s ease-out,background .12s ease-out}
.inp:focus{background:var(--surface);box-shadow:0 0 0 2px var(--ring)}
textarea.inp{height:auto;padding:12px 14px;line-height:1.45;resize:vertical}
.segs2{display:flex;padding:3px;border-radius:12px;background:var(--sunk-2);gap:2px}
.segs2 button{flex:1;height:40px;border:0;border-radius:9px;background:transparent;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:background .12s ease-out}
.segs2 button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(74,48,24,.12)}
.st.dlv{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.mini{display:grid;align-items:center;column-gap:10px;min-height:44px;font-size:14px}
.mini + .mini{box-shadow:0 -1px 0 var(--line)}
.pick{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 10px;border:0;border-radius:10px;background:transparent;text-align:left;font-size:14px}
.pick:hover{background:var(--sunk)}
.pick:disabled{opacity:.5;cursor:default}
.pick img{width:40px;height:40px;border-radius:8px;object-fit:cover}
.bar4{display:flex;gap:3px;height:10px;border-radius:5px;overflow:hidden}
.bar4 i{display:block;height:100%}
.dot2{display:inline-block;width:10px;height:10px;border-radius:3px}
@keyframes flash{0%{background:var(--accent-tint-2)}100%{background:transparent}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}60%{transform:translateX(3px)}}
@keyframes lineIn{0%{opacity:0;transform:translateX(18px) scale(.98)}100%{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.96) translateY(-4px)}100%{opacity:1;transform:none}}
@keyframes popin{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@keyframes up{0%{opacity:0;transform:translate(-50%,10px)}100%{opacity:1;transform:translate(-50%,0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes needle{0%{transform:rotate(-58deg)}55%{transform:rotate(-38deg)}100%{transform:rotate(-50deg)}}
.needle{transform-origin:12px 15px;transform:rotate(-50deg);animation:needle 2.8s ease-in-out infinite alternate}

/* ===== Sakin yeniden tasarım ===== */
.mono{font-family:"Onest",ui-sans-serif,sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.plate,.oem,.code{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.plate{display:inline-flex;align-items:center;height:22px;padding:0 6px;border-radius:5px;background:var(--sunk-2);box-shadow:none;font-size:12px;font-weight:500;color:var(--ink);letter-spacing:.02em}
.nav.on{background:var(--sunk-2);color:var(--ink)}
.nav.on .ic{color:var(--ink)}
.smain{position:relative;flex:999 1 520px;min-width:0;height:100%;display:flex;flex-direction:column;padding:8px 28px 0}
.search{height:56px;padding:0 6px 0 18px;border-radius:12px;background:var(--surface);box-shadow:0 1px 2px rgba(74,48,24,.06),0 0 0 1px var(--line)}
.search:focus-within,.search.is-focus{box-shadow:0 0 0 1.5px var(--ring)}
.search input{font-size:17px;font-weight:400}
.sdiv{width:1px;height:28px;background:var(--line);margin:0 4px}
.mbtn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px;border:0;border-radius:9px;background:transparent;font-size:14.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.mbtn:hover{background:var(--sunk);color:var(--ink)}
.mbtn.on{color:var(--ink);font-weight:600;padding-right:4px}
.mbtn.on button{width:34px;height:34px;border:0;border-radius:8px;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
.mbtn.on button:hover{background:var(--sunk)}
.ctx{font-size:14px;color:var(--ink-2);margin:14px 2px 0}
.pgrid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px;padding:20px 0 8px}
.pcard{background:var(--surface);border-radius:12px;box-shadow:0 1px 2px rgba(74,48,24,.06);transition:box-shadow .12s ease-out,transform .12s ease-out}
.pcard:hover{box-shadow:0 1px 2px rgba(74,48,24,.06),0 0 0 1px var(--line-2)}
.pcard.act{box-shadow:0 0 0 2px var(--accent)}
.pimg{height:132px;margin:0;border-radius:12px 12px 0 0;background:#fff}
.rl[data-theme="dark"] .pimg{background:#fff}
.pimg img{object-fit:contain;padding:10px}
.pcard.out .pimg img{opacity:.35;filter:grayscale(1)}
.pbody{padding:10px 14px 12px}
.pcard .pname{font-size:14.5px;font-weight:500;line-height:1.3;min-height:38px;color:var(--ink)}
.pfoot{padding-top:6px}
.pcard .price{font-size:18px;font-weight:600;letter-spacing:-.01em}
.stxt{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.cbadge{top:8px;right:8px;left:auto;bottom:auto;min-width:28px;height:28px;padding:0 8px;justify-content:center;border-radius:999px;font-size:14px;font-weight:700;box-shadow:none}
.credit{display:block;margin:8px auto 0;border:0;background:transparent;font-size:12px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;height:32px}
.receipt{position:relative;flex:0 0 clamp(360px,27vw,400px);height:100%;display:flex;flex-direction:column;background:var(--surface);box-shadow:-1px 0 0 var(--line)}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 10px}
.rhead h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.rlink{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-size:14px;font-weight:600;color:var(--accent-ink);cursor:pointer}
.rlink:hover{background:var(--sunk)}
.rlink:disabled{opacity:.4;cursor:default;background:transparent}
.rcust{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 6px 0 12px;border:0;border-radius:999px;background:var(--sunk-2);font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.rcust .ic{color:var(--ink-2)}
.rsub{padding:0 20px 12px;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.line{grid-template-columns:minmax(0,1fr) auto;row-gap:6px;padding:12px 8px;border-radius:10px}
.line.wp{grid-template-columns:44px minmax(0,1fr) auto}
.lthumb{width:44px;height:44px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.lthumb img{object-fit:contain;padding:3px}
.lname{font-size:14.5px;font-weight:500}
.ltot{font-size:15px;font-weight:600}
.lsub{font-size:13px}
.qty{height:36px;border-radius:10px;background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);justify-self:end}
.qty button{width:40px;height:36px;border-radius:10px}
.qty span{min-width:24px;font-size:14.5px}
.rfoot{flex:none;display:flex;flex-direction:column;padding:14px 20px 20px;box-shadow:0 -1px 0 var(--line)}
.rtot{display:flex;align-items:baseline;justify-content:space-between}
.rtot>span:first-child{font-size:15px;font-weight:600}
.total{font-size:36px;font-weight:700;letter-spacing:-.025em}
.rmeta{display:flex;align-items:center;justify-content:space-between;margin:2px -10px 0;font-size:13px;color:var(--ink-2)}
.rmeta>span{padding-right:10px}
.paybig{display:flex;align-items:center;justify-content:center;gap:10px;height:62px;margin-top:14px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:700;letter-spacing:-.01em;cursor:pointer;transition:transform .12s ease-out,background .12s ease-out}
.paybig:hover{background:#E8833E}
.paybig:active{transform:scale(.985)}
.paybig:disabled{background:var(--sunk-2);color:var(--ink-3);cursor:default;transform:none}
.paybig span{font-size:12px;font-weight:600;opacity:.6}
.pstep{display:flex;flex-direction:column;margin-top:14px;animation:fade .14s ease-out}
.pq{display:flex;align-items:center;justify-content:space-between;margin:0 -10px 8px 0;font-size:15px;font-weight:600}
.pgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.meth{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:8px;height:84px;padding:0 16px;border:0;border-radius:14px;background:var(--sunk);font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;transition:background .12s ease-out}
.meth:hover{background:var(--accent-tint)}
.meth i{position:absolute;top:10px;right:12px;font-style:normal;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.meth.dis{opacity:.45}
.cashin{height:60px;font-size:26px;font-weight:600;text-align:right}
.quick4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.quick4 button{height:44px;border:0;border-radius:10px;background:var(--sunk);font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.quick4 button:hover{background:var(--sunk-2)}
.change{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px;font-size:14.5px;color:var(--ink-2)}
.change b{font-size:22px;font-weight:700;color:var(--ink)}
@media (max-height:820px){.paybig{height:54px;margin-top:10px}.meth{height:66px}.total{font-size:30px}.pimg{height:110px}}


/* ===== B: nötr ===== */
.needle{animation:none !important;transform:rotate(-50deg)}
.rl{--bg:#F4F4F3;--surface:#FFFFFF;--sunk:#F1F1F0;--sunk-2:#EAEAE8;--line:#E6E6E4;--line-2:#D9D9D6;--ink:#18181B;--ink-2:#5F5F66;--ink-3:#9A9AA0;--accent:#18181B;--accent-ink:#18181B;--accent-tint:#F1F1F0;--accent-tint-2:#E6E6E4;--on-accent:#FFFFFF;--ring:#18181B;--warn-ink:#9A5B00;--err-ink:#B42318;--ok-ink:#1F7A4D;--illo:#E6E6E4;--illo-line:#5F5F66;--swatch-ring:rgba(24,24,27,.2)}
.rl[data-theme="dark"]{--bg:#111112;--surface:#1A1A1C;--sunk:#202023;--sunk-2:#28282C;--line:#2A2A2E;--line-2:#38383D;--ink:#F4F4F5;--ink-2:#A1A1AA;--ink-3:#71717A;--accent:#F4F4F5;--accent-ink:#F4F4F5;--accent-tint:#26262A;--accent-tint-2:#303035;--on-accent:#111112;--ring:#F4F4F5;--warn-ink:#E8BC62;--err-ink:#F08A73;--ok-ink:#7CC79A;--illo:#2A2A2E;--illo-line:#A1A1AA;--swatch-ring:rgba(244,244,245,.35)}
.paybig{background:var(--accent);color:var(--on-accent);border-radius:12px}
.paybig:hover{background:var(--accent);opacity:.9}
.paybig:disabled{background:var(--sunk-2);color:var(--ink-3);opacity:1}
.tbtn.pri,.pay.pri{background:var(--accent);color:var(--on-accent)}
.tbtn.pri:hover,.pay.pri:hover{background:var(--accent);opacity:.9}
.pcard{border-radius:10px;box-shadow:0 0 0 1px var(--line)}
.pcard:hover{box-shadow:0 0 0 1px var(--line-2)}
.pcard.act{box-shadow:0 0 0 2px var(--ink)}
.pcard:active{transform:none}
.pimg{border-radius:10px 10px 0 0;background:#fff}
.cbadge{background:var(--ink);color:var(--surface)}
.search{box-shadow:0 0 0 1px var(--line)}
.search:focus-within,.search.is-focus{box-shadow:0 0 0 1.5px var(--ink)}
.rlink{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.rlink:hover{text-decoration-color:var(--ink)}
.rcust{background:var(--sunk-2)}
.meth:hover{background:var(--sunk-2)}
.av{background:var(--sunk-2);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--surface);box-shadow:none}
.st.work{background:#FDF0E6;color:#9A4A12}
.rl[data-theme="dark"] .st.work{background:#3A2819;color:#F29A5C}
.badge{background:#E0752D}
.needle path{stroke:#E0752D !important}
.disc{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.nav:hover{background:var(--sunk-2)}
.rl ::selection{background:#E4E4E7}

.psku{margin-top:4px;font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;color:var(--ink-2);letter-spacing:.02em}
.rl,.rl *{cursor:default !important}
.rl .pcard,.rl .pcard *,.rl .row2,.rl .row2 *,.rl .pick,.rl .pick *{cursor:pointer !important}
.rl input,.rl textarea{cursor:text !important}
.pcard{transition:box-shadow .2s ease-out,transform .14s ease-out}
.pcard:hover{box-shadow:0 0 0 1px #BDBDBA,0 6px 18px -12px rgba(24,24,27,.28)}
.rl[data-theme="dark"] .pcard:hover{box-shadow:0 0 0 1px #4A4A50,0 6px 18px -12px rgba(0,0,0,.6)}
.pcard.act,.pcard.act:hover{box-shadow:0 0 0 2px var(--ink)}
.pcard:active{transform:scale(.985) !important}
.pimg img{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.pcard:hover .pimg img{transform:scale(1.045)}
.pcard.out:hover .pimg img{transform:none}
.padd{position:absolute;z-index:2;right:10px;bottom:10px;width:34px;height:34px;border-radius:999px;background:var(--ink);color:var(--surface);display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(6px) scale(.9);transition:opacity .18s ease-out,transform .22s cubic-bezier(.2,.8,.2,1)}
.rl[data-theme="dark"] .padd{background:#18181B;color:#fff}
.padd svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.pcard:hover .padd,.pcard.act .padd{opacity:1;transform:none}
.sech{margin:18px 2px 0;font-size:15px;font-weight:600;color:var(--ink)}
.sech + .pgrid{padding-top:12px}
.crumb{display:flex;align-items:center;gap:8px;margin:18px 0 0;font-size:15px;color:var(--ink-2)}
.crumb button{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 10px 0 4px;margin-left:-4px;border:0;border-radius:8px;background:transparent;font-size:15px;color:var(--ink-2)}
.crumb button:hover{background:var(--sunk-2);color:var(--ink)}
.crumb b{color:var(--ink);font-weight:600}
.crumb + .pgrid{padding-top:12px}
.sechrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sechrow > span{margin-left:auto}
.sechrow .qedit{align-self:center}
.sechrow>span{font-size:13px;color:var(--ink-2)}
.tgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}
.bcats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0 26px}
.bcat{display:flex;align-items:center;gap:16px;min-height:92px;padding:16px 18px;border:0;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--line);text-align:left;transition:box-shadow .2s ease-out,transform .14s ease-out}
.bcat:hover{box-shadow:0 0 0 1px #BDBDBA,0 8px 22px -14px rgba(24,24,27,.3)}
.bcat:active{transform:scale(.985)}
.bico{width:56px;height:56px;border-radius:14px;background:var(--sunk-2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.bico .ic{width:28px;height:28px;stroke-width:1.6}
.btxt{display:flex;flex-direction:column;gap:4px;min-width:0}
.btxt b{font-size:17px;font-weight:600;color:var(--ink);line-height:1.2}

</head><body><div id="root"></div>
<template id="tpl">
<div class="rl" data-theme="{{theme}}" onKeyDown="{{onKey}}" style="position: relative; display: flex; flex-wrap: wrap; width: 100%; height: 100vh; min-height: 640px; overflow: hidden; background: var(--shell)">

<!-- SOL MENÜ -->
<aside class="side" style="{{sideStyle}}" onMouseEnter="{{sideEnter}}" onMouseLeave="{{sideLeave}}"><div class="sidein" style="{{sideInStyle}}">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 6px 0 10px">
    <div style="display: flex; align-items: center; gap: 10px; color: var(--ink)">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 28px; height: 28px; flex: none; overflow: visible">
        <path d="M3.5 17.5a8.5 8.5 0 1 1 17 0" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"></path>
        <path d="M5.4 12.6l1.2.7M12 9v1.4M18.6 12.6l-1.2.7" style="fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-linecap: round"></path>
        <g class="needle"><path d="M12 15.5L12 7.2" style="fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round"></path></g>
        <circle cx="12" cy="15.5" r="1.9" style="fill: var(--ink)"></circle>
      </svg>
      <sc-if value="{{sideOpen}}" hint-placeholder-val="{{true}}">
        <span style="font-size: 21px; font-weight: 700; letter-spacing: -.035em">Rölanti</span>
      </sc-if>
    </div>
    <sc-if value="{{sideOpen}}" hint-placeholder-val="{{true}}">
      <button class="iconbtn" onClick="{{toggleSide}}" aria-label="Menüyü daralt" title="Menüyü daralt">
        <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"></rect><path d="M9.5 4.5v15M15.5 10l-2 2 2 2"></path></svg>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{sideClosed}}" hint-placeholder-val="{{false}}">
    <button class="iconbtn" onClick="{{toggleSide}}" aria-label="Menüyü genişlet" title="Menüyü genişlet" style="margin: 0 auto 8px">
      <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"></rect><path d="M9.5 4.5v15M13.5 10l2 2-2 2"></path></svg>
    </button>
  </sc-if>
  <nav id="t-nav" aria-label="Ana menü" style="display: flex; flex-direction: column; gap: 2px; margin-top: 10px">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <button class="{{n.cls}}" onClick="{{n.go}}" aria-current="{{n.current}}" title="{{n.label}}" style="{{n.style}}">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
        <sc-if value="{{n.showLabel}}" hint-placeholder-val="{{true}}"><span>{{n.label}}</span></sc-if>
      </button>
    </sc-for>
  </nav>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-bottom: 14px">
    <button class="nav" onClick="{{startTour}}" title="Tanıtım turu" style="{{n0style}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.1-2.4 3.6M12 16.8v.2"></path></svg>
      <sc-if value="{{sideOpen}}" hint-placeholder-val="{{true}}"><span>Tanıtım turu</span></sc-if>
    </button>
    <button class="{{setNavCls}}" onClick="{{openSettings}}" title="Ayarlar" style="{{n0style}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.4 1a7.4 7.4 0 0 0-2.6-1.5L14 2.6h-4l-.4 2.5A7.4 7.4 0 0 0 7 6.6l-2.4-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.4-1a7.4 7.4 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 2.6-1.5l2.4 1 2-3.4z"></path></svg>
      <sc-if value="{{sideOpen}}" hint-placeholder-val="{{true}}"><span>Ayarlar</span></sc-if>
    </button>
    <div style="{{userStyle}}">
      <span class="av" style="width: 36px; height: 36px; border-radius: 10px; font-size: 13px; background: var(--sunk-2); color: var(--ink)">EK</span>
      <sc-if value="{{sideOpen}}" hint-placeholder-val="{{true}}">
        <span style="display: flex; flex-direction: column; min-width: 0; line-height: 1.25">
          <span style="font-size: 14px; font-weight: 600">Emre Kaya</span>
          <span style="font-size: 12.5px; color: var(--ink-2)">{{cfgBranch}}</span>
        </span>
      </sc-if>
    </div>
  </div>
</div></aside>

<!-- ORTA + SAĞ -->
<div class="frame" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">

  <!-- ÜST ŞERİT -->
  <header style="position: relative; display: flex; align-items: center; gap: 8px; height: 60px; flex: none; padding: 0 16px 0 24px">
    <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2)">
      <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20H4z"></path><path d="M9.5 20v-5.5h5V20"></path></svg>

        <sc-if value="{{stokEmpty}}" hint-placeholder-val="{{false}}"><div style="padding: 40px 18px; font-size: 15px; color: var(--ink-2)">Bu filtrede ürün yok.</div></sc-if>

          <button class="tbtn pri" onClick="{{newOrder}}" style="height: 44px"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Yeni iş emri</button>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px">
          <sc-for list="{{svTabs}}" as="t" hint-placeholder-count="5"><button class="{{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
        </div>
        <div class="tbl scroll">
          <div class="th" style="{{svCols}}"><span>Plaka</span><span>Müşteri · motor</span><sc-if value="{{svWide}}" hint-placeholder-val="{{true}}"><span>Şikâyet</span></sc-if><span>Durum</span><span class="r">Tutar</span></div>
          <sc-for list="{{svRows}}" as="r" hint-placeholder-count="6">
            <button class="{{r.cls}}" onClick="{{r.open}}" style="{{r.cols}}">
              <span><span class="plate mono" style="font-size: 13px; height: 28px; padding: 0 8px">{{r.plate}}</span><span class="mono" style="display: block; font-size: 11.5px; color: var(--ink-2); margin-top: 4px">No {{r.id}} · {{r.date}}</span></span>
              <span style="min-width: 0"><span style="display: block; font-weight: 600">{{r.name}}</span><span style="display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px">{{r.bike}}</span></span>
              <sc-if value="{{svWide}}" hint-placeholder-val="{{true}}"><span style="font-size: 14px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{r.complaint}}</span></sc-if>
              <span><span class="{{r.stCls}}"><i></i>{{r.status}}</span></span>
              <span class="mono r" style="font-weight: 600">{{r.total}}</span>
            </button>
          </sc-for>
          <sc-if value="{{svEmpty}}" hint-placeholder-val="{{false}}"><div style="padding: 40px 18px; color: var(--ink-2)">Bu durumda iş emri yok.</div></sc-if>
        </div>
      </div>

      <sc-if value="{{soOpen}}" hint-placeholder-val="{{false}}">
        <aside class="drawer scroll" aria-label="İş emri">

            <div style="flex: 1; min-width: 0">
              <div style="font-size: 19px; font-weight: 700; letter-spacing: -.01em">{{so.heading}}</div>
              <div style="font-size: 13.5px; color: var(--ink-2); margin-top: 4px; line-height: 1.4">{{so.sub}}</div>
            </div>
            <button class="iconbtn" onClick="{{closeOrder}}" aria-label="Kapat"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
          </div>
          <div class="dbody">
            <sc-if value="{{so.isNew}}" hint-placeholder-val="{{false}}">
              <label class="fld">Plaka<input class="inp mono" ref="{{plateRef}}" value="{{so.plate}}" onChange="{{onPlate}}" placeholder="34 MTR 482" autoComplete="off" style="font-size: 18px; font-weight: 600; letter-spacing: .03em"></label>
              <sc-if value="{{so.known}}" hint-placeholder-val="{{false}}"><div style="margin-top: -6px; padding: 10px 14px; border-radius: 12px; background: var(--ok-tint); font-size: 14px"><b style="font-weight: 600">{{so.name}}</b> · {{so.bike}}</div></sc-if>
              <sc-if value="{{so.unknown}}" hint-placeholder-val="{{false}}">
                <label class="fld">Müşteri adı<input class="inp" value="{{so.name}}" onChange="{{onOName}}" placeholder="Ad soyad"></label>
                <label class="fld">Motor<input class="inp" value="{{so.bike}}" onChange="{{onOBike}}" placeholder="Ör. Honda PCX 125"></label>
              </sc-if>
              <label class="fld">Kilometre<input class="inp mono" value="{{so.km}}" onChange="{{onOKm}}" inputMode="numeric" placeholder="Ör. 18.400"></label>
              <label class="fld">Şikâyet<textarea class="inp" value="{{so.complaint}}" onChange="{{onOComp}}" rows="3" placeholder="Müşterinin anlattığı sorun"></textarea></label>
            </sc-if>
            <sc-if value="{{so.isView}}" hint-placeholder-val="{{true}}">
              <p style="margin: 0; font-size: 15px; line-height: 1.5">{{so.complaint}}</p>
              <div class="segs2" role="group" aria-label="Durum">
                <sc-for list="{{so.statuses}}" as="st" hint-placeholder-count="4"><button class="{{st.cls}}" onClick="{{st.run}}" aria-pressed="{{st.on}}">{{st.label}}</button></sc-for>
              </div>
            </sc-if>
            <div>
              <div style="font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px">Parçalar</div>
              <sc-for list="{{so.parts}}" as="pt" hint-placeholder-count="2">
                <div class="mini" style="grid-template-columns: minmax(0,1fr) auto 84px 40px">
                  <span style="line-height: 1.35">{{pt.name}}</span>
                  <span class="mono" style="font-size: 12.5px; color: var(--ink-2)">{{pt.qty}}</span>
                  <span class="mono r">{{pt.amount}}</span>
                  <button class="iconbtn" onClick="{{pt.del}}" aria-label="Parçayı çıkar" style="width: 40px; height: 40px"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
                </div>
              </sc-for>
              <sc-if value="{{so.noParts}}" hint-placeholder-val="{{false}}"><div style="font-size: 13.5px; color: var(--ink-2); padding: 4px 0 8px">Henüz parça eklenmedi.</div></sc-if>
              <input class="inp" value="{{partQ}}" onChange="{{onPartQ}}" placeholder="Parça ekle · ad, stok kodu ya da OEM" autoComplete="off" style="width: 100%; margin-top: 8px">

                <div style="margin-top: 6px; padding: 4px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line)">

                    <button class="pick" onClick="{{pr.add}}" disabled="{{pr.disabled}}">
                      <sc-if value="{{pr.hasPhoto}}" hint-placeholder-val="{{false}}"><img src="{{pr.photo}}" alt=""></sc-if><sc-if value="{{pr.noPhoto}}" hint-placeholder-val="{{true}}"><span class="thumb" style="width: 40px; height: 40px"></span></sc-if>
                      <span style="line-height: 1.3">{{pr.name}}</span>
                      <span class="{{pr.stCls}}">{{pr.stock}}</span>
                      <span class="mono" style="font-weight: 600">{{pr.price}}</span>
                    </button>
                  </sc-for>
                </div>
              </sc-if>
            </div>
            <label class="fld" style="flex-direction: row; align-items: center; justify-content: space-between">İşçilik (₺)<input class="inp mono" value="{{so.labor}}" onChange="{{onOLabor}}" inputMode="decimal" placeholder="0" style="width: 140px; text-align: right"></label>
            <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 6px; box-shadow: 0 -1px 0 var(--line)">
              <span style="font-size: 15px; font-weight: 600; padding-top: 10px">Toplam</span>
              <span class="mono" style="font-size: 28px; font-weight: 600; letter-spacing: -.02em">{{so.total}}</span>
            </div>
            <sc-if value="{{soErr}}" hint-placeholder-val="{{false}}"><div style="font-size: 14px; color: var(--err-ink); font-weight: 600">{{soErr}}</div></sc-if>
            <sc-if value="{{so.isNew}}" hint-placeholder-val="{{false}}"><button class="pay pri" onClick="{{saveOrder}}" style="justify-content: center">İş emrini aç</button></sc-if>
            <sc-if value="{{so.canPay}}" hint-placeholder-val="{{false}}"><button class="pay pri" onClick="{{toPay}}" style="justify-content: center">Ödemeye aktar</button></sc-if>
            <sc-if value="{{so.delivered}}" hint-placeholder-val="{{false}}"><div style="font-size: 14px; color: var(--ink-2)">Bu iş emri teslim edildi ve ödemesi alındı.</div></sc-if>
          </div>
        </aside>
      </sc-if>
    </section>
  </sc-if>

  <!-- CARİ -->
  <sc-if value="{{isCari}}" hint-placeholder-val="{{false}}">
    <section class="pg" aria-labelledby="h-cari" style="flex-direction: row; gap: 16px">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <div class="pghead">
          <h1 id="h-cari" style="margin-right: 0">Cari</h1>
          <span class="sub" style="margin-right: auto">{{caSub}}</span>
          <span class="sub">Açık veresiye <b class="mono" style="color: var(--warn-ink); font-weight: 600">{{caOpen}}</b></span>
          <button class="tbtn" onClick="{{openExport}}" style="height: 44px; margin-left: 12px"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 19h14"></path></svg>Dışa aktar</button>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px">
          <div class="search" style="height: 50px; flex: 1 1 200px; max-width: 340px">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink-2)"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
            <input value="{{caQ}}" onChange="{{onCaQ}}" placeholder="Ad, telefon ya da plaka" aria-label="Cari ara" style="font-size: 15px">
          </div>
          <sc-for list="{{caTabs}}" as="t" hint-placeholder-count="3"><button class="{{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
        </div>
        <div class="tbl scroll">
          <div class="th" style="{{caCols}}"><span>Ad</span><sc-if value="{{caWide}}" hint-placeholder-val="{{true}}"><span>Telefon</span><span>Plaka</span></sc-if><span class="r">Bakiye</span></div>
          <sc-for list="{{caRows}}" as="r" hint-placeholder-count="8">
            <button class="{{r.cls}}" onClick="{{r.open}}" style="{{r.cols}}">
              <span style="display: flex; align-items: center; gap: 12px; min-width: 0"><span class="av" style="width: 36px; height: 36px; font-size: 13px">{{r.initials}}</span><span style="min-width: 0"><span style="display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="display: block; font-size: 12.5px; color: var(--ink-2)">{{r.sub}}</span></span></span>
              <sc-if value="{{caWide}}" hint-placeholder-val="{{true}}"><span class="mono" style="font-size: 13.5px">{{r.phone}}</span><span class="mono" style="font-size: 13px; color: var(--ink-2)">{{r.plates}}</span></sc-if>
              <span class="r"><span class="mono" style="display: block; font-weight: 600; color: {{r.balColor}}">{{r.bal}}</span><span style="display: block; font-size: 12px; color: var(--ink-2)">{{r.balNote}}</span></span>
            </button>
          </sc-for>
          <sc-if value="{{caEmpty}}" hint-placeholder-val="{{false}}"><div style="padding: 40px 18px; color: var(--ink-2)">Eşleşen hesap yok.</div></sc-if>
        </div>
      </div>

      <sc-if value="{{cdOpen}}" hint-placeholder-val="{{false}}">
        <aside class="drawer scroll" aria-label="Hesap" style="width: 480px">
          <div class="dhead">
            <span class="av" style="margin-right: 4px">{{cd.initials}}</span>
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 18px; font-weight: 700">{{cd.name}}</div>
              <div style="font-size: 13px; color: var(--ink-2); margin-top: 3px"><span class="mono">{{cd.phone}}</span> · {{cd.extra}}</div>
            </div>
            <button class="iconbtn" onClick="{{closeCari}}" aria-label="Kapat"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
          </div>
          <div class="dbody" style="gap: 14px">
            <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
              <div><div style="font-size: 13px; color: var(--ink-2)">{{cd.balLabel}}</div><div class="mono" style="font-size: 32px; font-weight: 600; letter-spacing: -.02em; color: {{cd.balColor}}">{{cd.bal}}</div></div>
              <sc-if value="{{tahClosed}}" hint-placeholder-val="{{true}}"><button class="tbtn pri" onClick="{{openTah}}" style="height: 46px">{{cd.action}}</button></sc-if>
            </div>
            <sc-if value="{{tahOpen}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: var(--sunk)">
                <label class="fld">Tutar<input class="inp mono" ref="{{tahRef}}" value="{{tah}}" onChange="{{onTah}}" inputMode="decimal" placeholder="{{cd.tahPh}}" style="font-size: 20px; text-align: right; background: var(--surface)"></label>
                <div class="segs2"><sc-for list="{{tahMethods}}" as="m" hint-placeholder-count="3"><button class="{{m.cls}}" onClick="{{m.run}}" aria-pressed="{{m.on}}">{{m.label}}</button></sc-for></div>
                <div style="display: flex; gap: 8px"><button class="tbtn pri" onClick="{{doTah}}" style="height: 46px">{{cd.confirm}}</button><button class="tbtn plain" onClick="{{closeTah}}" style="height: 46px">Vazgeç</button></div>
              </div>

            <sc-if value="{{cd.isCust}}" hint-placeholder-val="{{true}}"><button class="tbtn" onClick="{{cd.sell}}" style="height: 44px; align-self: flex-start"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4zM9 8h6M9 11.5h6"></path></svg>Satışa al</button></sc-if>
            <div>
              <div style="font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 6px 0 4px">Hesap dökümü</div>
              <div class="mini" style="grid-template-columns: 46px minmax(0,1fr) 62px 62px 70px; font-size: 12px; color: var(--ink-2); font-weight: 600; min-height: 32px"><span>Tarih</span><span>Açıklama</span><span class="r">Borç</span><span class="r">Alacak</span><span class="r">Bakiye</span></div>
              <sc-for list="{{cd.moves}}" as="m" hint-placeholder-count="3">
                <div class="mini" style="grid-template-columns: 46px minmax(0,1fr) 62px 62px 70px; font-size: 13px; padding: 6px 0">
                  <span class="mono" style="font-size: 12px; color: var(--ink-2)">{{m.d}}</span>
                  <span style="line-height: 1.35">{{m.t}}</span>
                  <span class="mono r" style="font-size: 12.5px">{{m.b}}</span>
                  <span class="mono r" style="font-size: 12.5px">{{m.a}}</span>

                </div>
              </sc-for>

          </div>
        </aside>
      </sc-if>
    </section>
  </sc-if>

        <div class="pghead" style="margin-bottom: 18px"><h1 id="h-ayar" style="margin-right: auto">Ayarlar</h1><span class="sub">Değişiklikler otomatik kaydedilir</span></div>
        <div class="setg">
          <div class="hcard setc">
            <div class="hhead"><h2>İşletme bilgileri</h2></div>

            <div class="set2"><label class="fld">Kritik stok eşiği (adet)<input class="inp" value="{{st.low}}" onChange="{{st.setLow}}" inputMode="numeric"></label><label class="fld">Günlük satış hedefi (₺)<input class="inp" value="{{st.target}}" onChange="{{st.setTarget}}" inputMode="numeric"></label></div>

          </div>
          <div class="hcard setc">
            <div class="hhead"><h2>Görünüm</h2></div>
            <div class="fld">Tema<div class="seg2w"><sc-for list="{{st.themes}}" as="o" hint-placeholder-count="2"><button class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
            <div class="fld">Sol menü<div class="seg2w"><sc-for list="{{st.sides}}" as="o" hint-placeholder-count="2"><button class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
            <div class="fld">Tanıtım turu<div><button class="tbtn" onClick="{{st.tour}}" style="height: 42px">Turu baştan başlat</button></div></div>
          </div>
          <div class="hcard setc">
            <div class="hhead"><h2>Kullanıcılar</h2></div>
            <sc-for list="{{st.users}}" as="u" hint-placeholder-count="3">
              <div class="setu"><span class="av" style="width: 36px; height: 36px; font-size: 13px">{{u.initials}}</span><b>{{u.name}}</b><div class="seg2w sm"><sc-for list="{{u.roles}}" as="r" hint-placeholder-count="3"><button class="{{r.cls}}" onClick="{{r.pick}}">{{r.label}}</button></sc-for></div><sc-if value="{{u.canRm}}" hint-placeholder-val="{{true}}"><button class="iconbtn" onClick="{{u.rm}}" aria-label="Kullanıcıyı kaldır"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></sc-if></div>
            </sc-for>
            <div class="setadd"><input class="inp" value="{{st.newUser}}" onChange="{{st.setNewUser}}" placeholder="Ad soyad" aria-label="Yeni kullanıcı adı"><button class="tbtn" onClick="{{st.addUser}}" style="height: 48px"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Ekle</button></div>
          </div>

            <div class="fld">CSV ayırıcı<div class="seg2w"><sc-for list="{{st.seps}}" as="o" hint-placeholder-count="2"><button class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap"><button class="tbtn pri" onClick="{{st.exportAll}}" style="height: 44px"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 19h14"></path></svg>Verileri dışa aktar</button><button class="{{st.resetCls}}" onClick="{{st.reset}}" style="height: 44px">{{st.resetLabel}}</button></div>
          </div>
          <div class="hcard setc">
            <div class="hhead"><h2>Görsel lisansları</h2></div>
            <p class="setp">Örnek görseller açık lisanslıdır; kendi fotoğraflarınızı ürün detayından yükleyebilirsiniz.</p>
            <sc-for list="{{st.credits}}" as="c" hint-placeholder-count="5"><div class="setcr"><a href="{{c.url}}" target="_blank" rel="noopener">{{c.t}}</a><span>{{c.by}} · {{c.lic}}</span></div></sc-for>
          </div>
        </div>
      </div>
    </section>

        <div class="kcell" style="padding: 18px 20px">

        <sc-for list="{{k.recent}}" as="f" hint-placeholder-count="8">
          <div class="tr" style="grid-template-columns: 90px 70px minmax(0,1.2fr) minmax(0,2fr) 100px 120px; min-height: 54px">

            <span class="mono" style="font-size: 13.5px">{{f.time}}</span>
            <span style="font-weight: 600">{{f.who}}</span>
            <span style="font-size: 13.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.items}}</span>
            <span style="font-size: 13.5px">{{f.method}}</span>
            <span class="mono r" style="font-weight: 600">{{f.total}}</span>
          </div>
        </sc-for>
      </div>
      </div>
    </section>
  </sc-if>

          <div style="display: flex; gap: 8px; flex-wrap: wrap">
